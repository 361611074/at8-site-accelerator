name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      tag:
        description: '要重新打哪个 tag 的包（例如 v3.0.4）。留空则只跑校验、不打包。'
        required: false
        type: string

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. 语法检查 + 冒烟测试（PHP 版本矩阵）
  #
  # 插件声明 Requires PHP 7.4，但只在 7.4 上测是不够的：
  # PHP 8.x 移除了不少旧写法（花括号字符串下标、each()、create_function() 等），
  # 而 7.4 又能提前拦住"不小心用了 8.0 语法"。两头都要测。
  # ---------------------------------------------------------------------------
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.0', '8.1', '8.2', '8.3' ]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          ini-values: error_reporting=E_ALL, display_errors=On

      - name: 语法检查（全部 PHP 文件）
        run: |
          set -e
          find . -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 -P4 php -l

      - name: 冒烟测试
        run: php tests/unit/smoke.php

      # 第二轮整改新增的行为级验收。
      #
      # smoke.php 证明「代码里写了 if」，这个脚本证明「if 真的会拦」——
      # 逐个调用 admin_notices 渲染、真实写/回滚 wp-config.php、realpath 实测
      # Host 归一化能否逃出缓存根。缺了它，这三类回归只能靠人工点后台才能发现。
      # 它要读发行包，所以必须排在 build-zip 之后（见 round2-verify 任务）。
      - name: 第二轮集成验收
        run: php tests/unit/round2-integration.php

      - name: 翻译模板是否与源码同步
        run: |
          set -e
          php tools/make-pot.php
          if ! git diff --quiet -- languages/at8-site-accelerator.pot; then
            echo "::error::languages/at8-site-accelerator.pot 已过期。请在本地运行 php tools/make-pot.php 并提交结果。"
            git --no-pager diff --stat -- languages/at8-site-accelerator.pot
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # 2. 带 Redis 的冒烟 + 单元测试
  #
  # 上面那个 test 任务跑在没有 Redis 的 runner 上，覆盖的其实是"Redis 不可达 →
  # 降级磁盘"这条路径。而 Redis 可达时的分支（后端探测、Config 写 backend=redis、
  # 失效器打 Redis、索引集合与 SCAN 兜底）在那边一行都没被执行过。
  #
  # 这不是假想的风险：2026-09-26 在真机（装了 Redis）验证时，正是因为存在这个盲区，
  # "失效器断言的是磁盘文件、实际清的却是 Redis" 的测试缺陷一直藏到部署才发现。
  # 后来又在这个盲区里漏掉了第二个缺陷：purge_all() 先换盐再 flush，
  # 导致每个旧版本的索引集合（SADD 建的、无 TTL）被永久孤立在 Redis 里。
  #
  # 所以这里不仅跑冒烟，还要跑 PHPUnit——RedisBackendTest 在没有 Redis 的
  # runner 上是 skip 的，只有这个 job 能让它真正执行。
  #
  # 测试用 15 号逻辑库（tests/unit/wp-stubs.php 里固定），不碰插件的默认 2 号库。
  # ---------------------------------------------------------------------------
  test-redis:
    name: 冒烟 + 单元测试（Redis 后端）
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
          ini-values: error_reporting=E_ALL, display_errors=On

      # 插件用的是纯 PHP RESP 客户端，不依赖 phpredis 扩展——
      # 这里刻意不装扩展，顺便验证"没有扩展也能连上"这个卖点。
      - name: 确认 Redis 可达
        run: |
          set -e
          php -r '$s = @fsockopen("127.0.0.1", 6379, $e, $m, 3); if (!$s) { fwrite(STDERR, "Redis 不可达: $m\n"); exit(1); } fwrite($s, "PING\r\n"); $r = fgets($s); fclose($s); if (false === strpos($r, "PONG")) { fwrite(STDERR, "PING 异常: $r\n"); exit(1); } echo "Redis OK (纯 PHP RESP 客户端)\n";'

      - name: 冒烟测试
        run: php tests/unit/smoke.php

      - name: 缓存 Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-redis-8.2-${{ hashFiles('composer.json') }}

      - name: 安装开发依赖
        run: composer update --no-interaction --prefer-dist --no-progress

      # RedisBackendTest 会在这里真正执行；若 Redis 意外不可达，用例会 skip 而非
      # 静默通过——所以下面额外断言"跳过数为 0"，防止 skip 悄悄吃掉覆盖。
      - name: 运行 PHPUnit（Redis 用例必须真的跑起来）
        run: |
          set -e
          ./vendor/bin/phpunit --configuration phpunit.xml.dist | tee /tmp/phpunit-redis.log
          if grep -qE '^OK \(' /tmp/phpunit-redis.log && ! grep -qi 'skipped' /tmp/phpunit-redis.log; then
            echo "Redis 用例已执行，无跳过。"
          else
            echo "::error::Redis 用例被跳过或未执行——覆盖形同虚设。"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # 3. 编码规范（WordPress Coding Standards）
  #
  # 阻断式：存量已清零（535 -> 0），从 3.0.1 起任何新增违规都会让 CI 变红。
  # phpcs.xml.dist 里每一处豁免都写了理由，豁免范围有据可查。
  # ---------------------------------------------------------------------------
  phpcs:
    name: PHPCS (WordPress 规范)
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: phpcs

      - name: 拉取 WordPress 规范
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction wp-coding-standards/wpcs:^3 dealerdirect/phpcodesniffer-composer-installer

      - name: 执行 phpcs
        run: phpcs --standard=phpcs.xml.dist --report=summary --colors

  # ---------------------------------------------------------------------------
  # 4. 单元测试（PHPUnit，计划书 §72 / §89 / §130）
  #
  # 与冒烟测试的分工：冒烟测试保证"整条链路还活着"（38 个类能不能加载、
  # 安装/停用/卸载/drop-in 命中路径跑不跑得通），单元测试保证"逻辑对不对"。
  # 两者都要有——2026-09-26 补上 PHPUnit 时，它立刻抓出了一个冒烟测试
  # 完全没覆盖的缺陷：内置绕过 Cookie 表里的前缀漏写 `*`，导致
  # wp-postpass_ 永远匹配不上，密码保护页面会被缓存给未输密码的访客。
  #
  # 矩阵只取两端（7.4 下限 / 8.3 当前）：单元测试不测语言兼容性，
  # 那件事由上面的 test 任务在 7.4~8.3 全矩阵上做。
  # ---------------------------------------------------------------------------
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.3' ]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: 缓存 Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-phpunit-${{ matrix.php }}-${{ hashFiles('composer.json') }}

      # 用 update 而不是 install：composer.lock 被刻意排除在版本控制之外
      # （本插件对外分发时不带 vendor/，锁文件对使用者无意义）。
      # 代价是 CI 可能被上游新版本打破，所以 composer.json 里的约束都用 ^ 锁大版本。
      - name: 安装开发依赖
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: 运行 PHPUnit
        run: ./vendor/bin/phpunit --configuration phpunit.xml.dist

  # ---------------------------------------------------------------------------
  # 5. 静态分析（PHPStan，计划书 §72 / §89 / §130）
  #
  # level 5 + phpstan-wordpress + WooCommerce 类桩。
  # 豁免只有 1 条（Webp::load() 的 GdImage 返回类型，见 phpstan.neon.dist 里的说明），
  # 其余"恒真/恒假"类告警是通过 treatPhpDocTypesAsCertain: false 关掉的，
  # 那不是在关检查，而是承认"PHPDoc 是契约不是运行时保证"——WordPress 插件
  # 的数据大量来自第三方过滤器，防御性判空必须留着。
  # ---------------------------------------------------------------------------
  phpstan:
    name: PHPStan (level 5)
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: 缓存 Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-phpstan-${{ hashFiles('composer.json') }}

      - name: 安装开发依赖
        run: composer update --no-interaction --prefer-dist --no-progress

      # WooCommerce 类桩有 4.4MB，默认 128M 内存装不下，必须显式放宽。
      - name: 运行 PHPStan
        run: ./vendor/bin/phpstan analyse --configuration=phpstan.neon.dist --memory-limit=2G --no-progress

  # ---------------------------------------------------------------------------
  # 6. 打包产物
  #
  # 触发时机有两种：
  #   - 打 tag（refs/tags/v*）：正常发布路径，全量校验通过后才产出；
  #   - workflow_dispatch 手动：用于"tag 打早了、代码后来又修了"这种补救，
  #     手动指定 tag 重新产出并覆盖 Release 附件，不必删 tag 重打。
  #
  # 为什么加手动入口：tag 是不可变引用，正常流程应该是"CI 全绿 → 打 tag"。
  # 但现实中经常先打了 tag 才发现问题（3.0.4 就这么翻的车）。
  # 有了手动入口，补救就不必删 tag——那会破坏已分发的引用。
  # ---------------------------------------------------------------------------
  package:
    name: 打包 Free 版 ZIP
    runs-on: ubuntu-latest
    needs: [ test, test-redis, phpunit, phpstan ]
    # tag push：正常发布路径。
    # 手动触发：必须填 inputs.tag —— 否则打出来的是分支代码，
    # 而"挂到 Release"那一步会拿分支名当tag 名去找 Release，必然失败，
    # 与其跑到最后一步才报错，不如一开始就拦住。
    if: startsWith( github.ref, 'refs/tags/v' ) || ( github.event_name == 'workflow_dispatch' && inputs.tag != '' )

    # 只有这个作业需要写权限（创建/更新 Release）。
    # 其余作业维持 workflow 顶层的 contents: read，不给多余权限。
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 手动触发时按输入的 tag 检出，否则默认检出当前分支——
          # 否则重新打的包会是分支代码而不是那个 tag 对应的代码。
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: 安装 PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: 打包
        run: php tools/build-zip.php

      # 打包后立刻自查：build-zip.php 内部已有一道 forbidden 路径检查，
      # 这里再加一道，double check。
      #
      # 注意匹配方式：必须匹配 ZIP 内层路径的**目录段**，
      # 不能用裸 grep——像 "docs" 这种字符串一旦出现在某个正常文件名里
      # 就会误报，整条流水线白跑一趟。
      - name: 校验产物内容
        run: |
          ZIP=$(ls dist/*.zip)
          echo "产物：$ZIP"
          echo "--- 条目清单 ---"
          unzip -Z1 "$ZIP"
          echo ""
          echo "--- 禁止出现的目录 / 文件自检 ---"
          LIST=$(unzip -Z1 "$ZIP")
          FAILED=0
          for bad in tests/ docs/ tools/ .github/ .wordpress-org/ vendor/ dist/; do
            if echo "$LIST" | grep -q "at8-site-accelerator/${bad}"; then
              echo "错误：产物里混入了 ${bad}"
              FAILED=1
            fi
          done
          for bad in composer.json composer.lock phpcs.xml.dist phpstan.neon.dist phpunit.xml.dist package.json .gitignore .gitattributes .DS_Store; do
            if echo "$LIST" | grep -q "at8-site-accelerator/${bad}\$"; then
              echo "错误：产物里混入了 ${bad}"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
          echo "自检通过：未混入任何开发文件。"
          echo ""
          echo "--- 顶层结构 ---"
          echo "$LIST" | awk -F/ 'NF>1 {print $2} NF==1 {print "(根)"$1}' | sort -u

      # 到了这一步 dist/ 里已经有真包了，重跑一次集成验收——
      # 这次「发行包级」那几组断言不再 SKIP，而是真的对着产物执行：
      # 单层目录、无 Pro 商业目录、无远程安装代码、无 License 校验代码。
      # 放在上传之前是因为上传完再失败，等于把不合规的包已经传出去了。
      - name: 第二轮集成验收（对真实产物）
        run: php tests/unit/round2-integration.php

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: at8-site-accelerator-${{ inputs.tag || github.ref_name }}
          path: dist/*.zip
          if-no-files-found: error

      # 把 ZIP 挂到对应的 Release 上。
      # tag 存在但 Release 不存在时自动建一个，避免"打完包还要手动传一遍"。
      - name: 挂到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*.zip
          fail_on_unmatched_files: true
